# Databricks App definition – runs as service principal RPADLAKEFLOW-PROD.
# Tables are created in bfl_std_lake.financerpa (dropped and recreated on every run).
# App resources needed (Edit app -> App resources):
#   - SQL warehouse  -> key "sql-warehouse", permission Can use
#   - Secret         -> scope "refund-recon", key "rpadlakeflow-secret", permission Can read, resource key "sp-secret"
command: ["streamlit", "run", "app.py"]
env:
  - name: DATABRICKS_AUTH_TYPE
    value: "azure"
  - name: ARM_CLIENT_ID
    value: "6fb42e7e-346b-4c3b-b640-78138109275f"
  - name: ARM_TENANT_ID
    value: "710de1d3-2901-4647-89e7-3b01f1c2806d"
  - name: ARM_CLIENT_SECRET
    valueFrom: "sp-secret"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: RECON_CATALOG
    value: "bfl_std_lake"
  - name: RECON_SCHEMA
    value: "financerpa"
  - name: RECON_VOLUME
    value: "recon_uploads"
  - name: RECON_TABLE_PREFIX
    value: "bp_refund"
